*{box-sizing:border-box}html,body{height:100%;margin:0}

.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin:0}.big{font-size:22px;font-weight:700}.mu{color:var(--mu);font-size:13px}

.hero .mu{color:#d6efe3}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;background:var(--pr);color:#fff;font-weight:600}

input,select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}

.bars{display:flex;align-items:flex-end;gap:8px;height:110px}.bars div{flex:1;background:var(--pr);border-radius:8px 8px 0 0;min-height:3px;transition:height .4s}
.bars span{display:block;text-align:center;font-size:11px;color:var(--mu);margin-top:4px}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:9;padding-bottom:var(--kb,0px)}
.mod>div{background:var(--card);width:100%;max-width:560px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:90%;overflow:auto}
.low{color:var(--rd);font-weight:600}.pay button{flex:1}.pay{display:flex;gap:6px;margin:8px 0}
#rcp{display:none}@media print{#app,nav,.mod{display:none!important}#rcp{display:block;font:12px monospace;width:var(--pw,48mm);white-space:pre-wrap;color:#000;background:#fff;margin:0}body{background:#fff}@page{margin:0}}

 S.auth.ph=await H(m+':'+p1);S.auth.plen=pl_;S.fl=0;S.lk=0;save();am='login';av={};toast(hi?'PIN बदल गया। अब लॉग इन करें':'PIN changed. Please log in');authView()}

function logout(){ask(S.lang=='hi'?'लॉग आउट करना है?':'Log out?',()=>{authed=false;S.stay=false;am='login';av={};save();render()})}
async function chgLoginDo(v){const hi=S.lang=='hi';if(await H(S.auth.mob+':'+v[0])!==S.auth.ph){toast(hi?'पुराना PIN गलत है':'Old PIN is wrong');return}
 if(!/^(\d{4}|\d{6})$/.test(v[1])||v[1]!==v[2]){toast(hi?'नया PIN 4 या 6 अंक का हो और दोनों बराबर हों':'New PIN must be 4 or 6 digits and match');return}
 S.auth.ph=await H(S.auth.mob+':'+v[1]);S.auth.plen=v[1].length;save();toast(hi?'PIN बदल गया':'PIN changed')}
function chgLogin(){const hi=S.lang=='hi';modal(hi?'लॉगिन PIN बदलें':'Change login PIN',[[0,hi?'पुराना PIN':'Old PIN',PA],[1,hi?'नया PIN (4 या 6 अंक)':'New PIN (4 or 6 digits)',PA],[2,hi?'नया PIN दोबारा':'Confirm new PIN',PA]],chgLoginDo)}

const hp=z=>{let x=5381;for(const c of z)x=(x*33^c.charCodeAt(0))>>>0;return String(x)},PA='type=password inputmode=numeric maxlength=6';
function setPin(cb){modal(S.lang=='hi'?'नया PIN बनाएँ (4-6 अंक)':'Create PIN (4-6 digits)',[[0,'PIN',PA],[1,S.lang=='hi'?'PIN दोबारा':'Confirm PIN',PA]],v=>{if(v[0].length<4||v[0]!=v[1]){toast(S.lang=='hi'?'PIN कम से कम 4 अंक का और दोनों बराबर हों':'PIN must be 4+ digits and match');setPin(cb);return}S.pin=hp(v[0]);if(cb)cb()})}
function askPin(cb){if(!S.pin){setPin(cb);return}modal(S.lang=='hi'?'हटाने के लिए PIN डालें':'Enter PIN',[[0,'PIN',PA]],v=>{if(hp(v[0])===S.pin)cb();else toast(S.lang=='hi'?'गलत PIN':'Wrong PIN')})}
function changePin(){if(S.pin)askPin(()=>setPin());else setPin()}
function prodOf(i){return S.p.find(o=>o.id==i.id)||S.p.find(o=>o.name==i.n)}
function costOf(i){if(i.c!=null)return i.c;const p=prodOf(i);return p?p.cost:i.p}
function custOf(x){return S.c.find(o=>o.name==x.cust)}
function unbill(x){x.items.forEach(i=>{const p=prodOf(i);if(p)p.stock=Math.round((p.stock+i.q)*1000)/1000});const c=custOf(x);if(c&&x.due>0)c.due=Math.max(0,c.due-x.due)}
function editBill(no){const x=S.s.find(y=>y.no==no),f=[];
 x.items.forEach((i,k)=>{f.push([2*k,i.n+' - '+t('qty'),N+nv(0,i.q)]);f.push([2*k+1,i.n+' - '+t('price'),N+nv(0,i.p)])});
 modal('#'+no+' '+(S.lang=='hi'?'बिल सुधारें (मात्रा 0 = हटाएँ)':'Edit bill (qty 0 = remove)'),f,v=>{
  if(v.filter((_,k)=>k%2==0).every(a=>!num(a))){askPin(()=>{unbill(x);S.s=S.s.filter(y=>y!==x)});return}
  const old=x.total,od=x.due||0;
  x.items.forEach((i,k)=>{const p=prodOf(i),nq=num(v[2*k]);i.c=costOf(i);if(p)p.stock=Math.round((p.stock+i.q-nq)*1000)/1000;i.d=Math.round((i.d||0)*nq/i.q*100)/100;i.q=nq;i.p=num(v[2*k+1])});
  x.items=x.items.filter(i=>i.q>0);
  if(!x.items.length){const c=custOf(x);if(c&&od>0)c.due=Math.max(0,c.due-od);S.s=S.s.filter(y=>y!==x);return}
  x.total=rnd(x.items.reduce((a,i)=>a+i.p*i.q-(i.d||0),0));
  x.profit=x.items.reduce((a,i)=>a+i.p*i.q-(i.d||0)-i.c*i.q,0);
  x.sav=Math.round(x.items.reduce((a,i)=>a+(i.m>i.p?(i.m-i.p)*i.q:0)+(i.d||0),0)*100)/100;
  if(od>0){const nd=Math.max(0,od+x.total-old),c=custOf(x);if(c)c.due=Math.max(0,c.due+nd-od);x.due=nd}
 },()=>{unbill(x);S.s=S.s.filter(y=>y!==x)})}
function setUpi(){modal('UPI ID',[[0,'UPI ID','placeholder="name@bank" '+nv(0,S.upi||'')]],v=>{S.upi=v[0]})}
function showQR(no,amt){const hi=S.lang=='hi';
 if(!S.upi){toast(hi?'पहले More में अपनी UPI ID डालें':'First add your UPI ID in More');showBill(no);return}
 const url='upi://pay?pa='+encodeURIComponent(S.upi)+'&pn='+encodeURIComponent(S.shop)+'&am='+Number(amt).toFixed(2)+'&cu=INR&tn='+encodeURIComponent('Bill '+no),m=document.createElement('div');m.className='mod';
 m.innerHTML=`<div style="text-align:center"><h2>📲 UPI ${inr(amt)}</h2><div class="mu">${esc(S.shop)} · ${esc(S.upi)}</div><div id="qr" style="background:#fff;padding:12px;border-radius:14px;display:inline-block;margin:12px 0"></div><div class="g2"><button class="s" id="qc">${hi?'बाद में':'Later'}</button><button id="qo">${hi?'पैसे मिल गए ✓':'Received ✓'}</button></div></div>`;
 document.body.appendChild(m);
 try{new QRCode($('qr'),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}catch(e){$('qr').innerHTML='<a href="'+url+'">'+(hi?'UPI ऐप खोलें':'Open UPI app')+'</a>'}
 $('qc').onclick=$('qo').onclick=()=>{m.remove();showBill(no)}}
function mid(a,b,w){a=String(a);b=String(b);const l=' '.repeat(Math.max(0,(w-a.length)>>1))+a;return l.length+b.length<w?l.padEnd(w-b.length)+b:line(a,b,w)}
function rtext(x){const w=S.pw==80?48:32,r='-'.repeat(w),ctr=z=>' '.repeat(Math.max(0,(w-z.length)>>1))+z;
 let o=ctr(S.shop)+'\n'+ctr('Bill #'+x.no)+'\n'+ctr(new Date(x.ts).toLocaleString('en-IN'))+'\n'+(x.cust?'Customer: '+x.cust+'\n':'')+r+'\n';
 x.items.forEach(i=>{o+=line(i.n,Math.round((i.q*i.p-(i.d||0))*100)/100,w)+'\n'+ctr(i.q+(i.u&&i.u!='pc'?i.u:'')+' x '+i.p)+'\n'+(i.d>0?ctr('Discount -'+i.d)+'\n':'')+(i.m>i.p?'  MRP '+i.m+' -> '+i.p+' (save '+Math.round((i.m-i.p)*i.q*100)/100+')\n':'')});
 o+=r+'\n'+line('TOTAL',x.total,w)+'\n'+(x.xc>0?line('RETURN CREDIT','-'+x.xc,w)+'\n'+line('TO PAY',Math.round((x.total-x.xc)*100)/100,w)+'\n':'')+line('Payment',x.pay.toUpperCase(),w)+'\n';if(x.pay=='split'&&x.pays){if(x.pays.cash)o+=line(' Cash',x.pays.cash,w)+'\n';if(x.pays.upi)o+=line(' UPI',x.pays.upi,w)+'\n'}if(x.sav>0)o+=line('YOU SAVED',x.sav,w)+'\n';
 if(x.due>0)o+=line('DUE',x.due,w)+'\n';
 return o+r+'\n'+ctr('Thank you! Visit again')+'\n\n\n'}
function showBill(no){const x=S.s.find(y=>y.no==no),txt=rtext(x),m=document.createElement('div');m.className='mod';
 m.innerHTML=`<div><h2>✅ #${no}</h2><pre style="white-space:pre-wrap;font:13px monospace;overflow:auto">${esc(txt)}</pre><div class="g2"><button id="pb">🖨️ Print</button><button class="s" id="rb">RawBT</button></div><div class="g2" style="margin-top:8px"><button class="s" id="wb">WhatsApp</button><button class="s" id="mc">OK</button></div>${x.pays&&x.pays.upi>0?`<button class="s" id="qb" style="width:100%;margin-top:8px">📲 UPI QR</button>`:''}<div class="g2" style="margin-top:8px"><button class="s" id="eb">✏️ ${S.lang=='hi'?'बिल सुधारें':'Edit bill'}</button><button class="d" id="db">🗑️ ${S.lang=='hi'?'हटाएँ':'Delete'}</button></div></div>`;
 document.body.appendChild(m);$('mc').onclick=()=>m.remove();
 if($('qb'))$('qb').onclick=()=>{m.remove();showQR(no,x.pays.upi)};$('eb').onclick=()=>{m.remove();editBill(no)};$('db').onclick=()=>{m.remove();ask(S.lang=='hi'?'पूरा बिल हटाना है?':'Delete this bill?',()=>askPin(()=>{unbill(x);S.s=S.s.filter(y=>y!==x)}))};$('pb').onclick=()=>{$('rcp').textContent=txt;document.documentElement.style.setProperty('--pw',(S.pw==80?72:48)+'mm');window.print()};
 $('rb').onclick=()=>{location.href='intent:base64,'+btoa(unescape(encodeURIComponent(txt)))+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'};
 $('wb').onclick=()=>window.open('https://wa.me/'+(x.mob?'91'+x.mob.replace(/\D/g,'').slice(-10):'')+'?text='+encodeURIComponent(txt))}
function backup(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='kirana-hub-backup.json';a.click()}catch(e){toast(JSON.stringify(S))}}
function restore(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);['sup','pu','ex','sp','rt','cn'].forEach(k=>S[k]=S[k]||[]);save();render()}catch(e){toast('Invalid file')}};r.readAsText(f)}
if(window.visualViewport){const f=()=>{const kb=Math.max(0,window.innerHeight-visualViewport.height-visualViewport.offsetTop);document.documentElement.style.setProperty('--kb',kb+'px')};visualViewport.addEventListener('resize',f);visualViewport.addEventListener('scroll',f);f()}
document.addEventListener('focusin',e=>{const t0=e.target;if(t0&&t0.closest&&t0.closest('.mod'))setTimeout(()=>{try{t0.scrollIntoView({block:'nearest'})}catch(x){}},300)});
render();
</script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body></html>
